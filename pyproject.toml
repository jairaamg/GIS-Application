[project]
name = "gis-platform"
version = "0.1.0"
description = "Open-source 2D/3D GIS platform monorepo"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api-gateway/tests", "workers"]
