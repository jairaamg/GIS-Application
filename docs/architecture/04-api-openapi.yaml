openapi: 3.0.3
info:
  title: Open-Source 2D/3D GIS Platform API
  version: 1.0.0
  description: Versioned REST API for projects, datasets, layers and processing jobs.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /projects:
    get:
      summary: List projects
      operationId: listProjects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
    post:
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get project
      operationId: getProject
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
  /datasets:
    get:
      summary: List datasets
      operationId: listDatasets
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/DatasetStatus'
        - in: query
          name: source_format
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
    post:
      summary: Create dataset and upload session
      operationId: createDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreate'
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetUploadSession'
  /datasets/{datasetId}:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      summary: Get dataset
      operationId: getDataset
      responses:
        '200':
          description: Dataset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Archive dataset
      operationId: archiveDataset
      responses:
        '204':
          description: Archived
  /datasets/{datasetId}/metadata:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    get:
      summary: Get extracted dataset metadata
      operationId: getDatasetMetadata
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetMetadata'
  /datasets/{datasetId}/process:
    parameters:
      - $ref: '#/components/parameters/DatasetId'
    post:
      summary: Request dataset processing
      operationId: processDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      summary: Get processing job
      operationId: getJob
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    post:
      summary: Request cancellation
      operationId: cancelJob
      responses:
        '202':
          description: Cancellation requested
  /layers:
    get:
      summary: List layers
      operationId: listLayers
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Layers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Layer'
    post:
      summary: Create layer
      operationId: createLayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayerCreate'
      responses:
        '201':
          description: Layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
  /layers/{layerId}:
    parameters:
      - $ref: '#/components/parameters/LayerId'
    get:
      summary: Get layer
      operationId: getLayer
      responses:
        '200':
          description: Layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
    patch:
      summary: Update layer
      operationId: updateLayer
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/LayerUpdate'
      responses:
        '200':
          description: Updated layer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
  /health/live:
    get:
      security: []
      summary: Liveness
      operationId: liveness
      responses:
        '200':
          description: OK
  /health/ready:
    get:
      security: []
      summary: Readiness
      operationId: readiness
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    DatasetId:
      in: path
      name: datasetId
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
        format: uuid
    LayerId:
      in: path
      name: layerId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectCreate'
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    DatasetCreate:
      type: object
      required: [project_id, name, source_format]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        source_format:
          type: string
    DatasetUploadSession:
      type: object
      required: [dataset, upload_url]
      properties:
        dataset:
          $ref: '#/components/schemas/Dataset'
        upload_url:
          type: string
          format: uri
    Dataset:
      type: object
      required: [id, project_id, name, status, source_format]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/DatasetStatus'
        source_format:
          type: string
        dataset_type:
          type: string
        current_version_id:
          type: string
          format: uuid
          nullable: true
    DatasetPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    DatasetStatus:
      type: string
      enum: [UPLOADING, UPLOADED, VALIDATING, VALIDATED, PROCESSING, READY, FAILED, ARCHIVED]
    DatasetMetadata:
      type: object
      properties:
        format:
          type: string
        crs:
          type: string
          nullable: true
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        min_z:
          type: number
          nullable: true
        max_z:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        bands:
          type: integer
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    ProcessingRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            type: string
            enum: [VALIDATE, NORMALIZE, GENERATE_TILES, GENERATE_PREVIEW, GENERATE_TERRAIN, GENERATE_POINT_CLOUD_INDEX, GENERATE_3D_TILES]
    Job:
      type: object
      required: [id, type, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCEL_REQUESTED, CANCELLED]
        progress:
          type: number
          minimum: 0
          maximum: 100
        error_code:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
    LayerCreate:
      type: object
      required: [project_id, dataset_version_id, name, layer_type]
      properties:
        project_id:
          type: string
          format: uuid
        dataset_version_id:
          type: string
          format: uuid
        name:
          type: string
        layer_type:
          $ref: '#/components/schemas/LayerType'
        visible:
          type: boolean
          default: true
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        style:
          type: object
          additionalProperties: true
        source:
          type: object
          additionalProperties: true
    LayerUpdate:
      type: object
      properties:
        name:
          type: string
        visible:
          type: boolean
        opacity:
          type: number
          minimum: 0
          maximum: 1
        style:
          type: object
          additionalProperties: true
        source:
          type: object
          additionalProperties: true
    Layer:
      allOf:
        - $ref: '#/components/schemas/LayerCreate'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    LayerType:
      type: string
      enum: [VECTOR, RASTER, TERRAIN, POINT_CLOUD, MESH, MODEL_3D, BUILDING, HEATMAP, ELEVATION, ANNOTATION]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
